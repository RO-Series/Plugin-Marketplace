name: 自动更新插件市场索引

on:
  schedule:
    # 每天 UTC 时间 17:00 运行，对应上海时间 01:00
    - cron: "0 17 * * *"
  # 保留手动触发功能，方便调试
  workflow_dispatch:

jobs:
  generate-market:
    runs-on: ubuntu-latest
    
    # 关键：赋予工作流写入仓库内容的权限
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安装依赖
        run: |
          pip install requests pyyaml PyGithub
          
      - name: 执行市场索引生成脚本
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_market.py
          
      - name: 提交并推送更新
        # 移除 if 条件，让此步骤始终尝试执行，以便在日志中看到明确结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin_market.json
          # 如果没有变更，git commit 会失败，但通过 || 让脚本继续，并打印提示
          git commit -m "自动更新插件市场索引 [skip ci]" || echo "没有检测到需要提交的变更"
          git push
